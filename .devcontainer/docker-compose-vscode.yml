services:
  v2xhub:
    build: 
      context: ..
      dockerfile: ./Dockerfile
      target: build-environment
    image: v2xhub-devcontainer
    privileged: true
    # Building source code is memory intensive so we increase the memory limit.
    deploy:
      resources:
        limits:
          memory: 16g
        reservations:
          memory: 8g
    cap_add:
      - SYS_PTRACE
    volumes:
      # This is where VS Code should expect to find your project's source code and the value of "workspaceFolder" in .devcontainer/devcontainer.json
      - ..:/workspace:cached
    # Overrides default command so things don't shut down after the process ends.
    command: /bin/sh -c "while sleep 10000; do :; done"
    # Override healthcheck because it will fail in the devcontainer before building and php requires a healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 1
      start_period: 5s

  db:
    volumes:
      - ../.devcontainer/mysql_add_dev_user.sql:/docker-entrypoint-initdb.d/mysql_add_dev_user.sql