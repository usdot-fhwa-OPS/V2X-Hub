name: Build, Publish, and Run Integration Tests

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master
      - 'release/**'
      - 'feature/**'
    tags:
      - '*'
  pull_request:
    branches:
      - develop
      - master
      - 'release/**'
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: saikrishnabairamoni

jobs:
  build-php:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for PHP
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/php
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
      - name: Build and push PHP image
        uses: docker/build-push-action@v5
        with:
          file: ./docker/Dockerfile-php
          push: true
          sbom: true
          provenance: mode=max
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-port-drayage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Port Drayage
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/port-drayage-webservice
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
      - name: Build and push Port Drayage image
        uses: docker/build-push-action@v5
        with:
          context: ./tools/port-drayage-webservice/
          push: true
          sbom: true
          provenance: mode=max
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-v2xhub-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for V2X-Hub
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/v2xhub
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
      - name: Build and push V2X-Hub AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: true
          tags: ${{ env.DOCKERHUB_NAMESPACE }}/v2xhub:${{ steps.meta.outputs.version }}-amd64
          labels: ${{ steps.meta.outputs.labels }}

  build-v2xhub-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for V2X-Hub
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/v2xhub
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
      - name: Build and push V2X-Hub ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          sbom: true
          provenance: true
          tags: ${{ env.DOCKERHUB_NAMESPACE }}/v2xhub:${{ steps.meta.outputs.version }}-arm64
          labels: ${{ steps.meta.outputs.labels }}

  build-v2xhub-manifest:
    runs-on: ubuntu-22.04
    needs: [build-v2xhub-amd64, build-v2xhub-arm64]
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for V2X-Hub
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/v2xhub
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
      - name: Create final multi-arch V2X-Hub image
        run: |
          FINAL_TAG="${{ steps.meta.outputs.version }}"
          docker buildx imagetools create \
            --tag "${{ env.DOCKERHUB_NAMESPACE }}/v2xhub:${FINAL_TAG}" \
            "${{ env.DOCKERHUB_NAMESPACE }}/v2xhub:${FINAL_TAG}-amd64" \
            "${{ env.DOCKERHUB_NAMESPACE }}/v2xhub:${FINAL_TAG}-arm64"

  publish-docker-compose:
    runs-on: ubuntu-24.04
    needs:
      - build-php
      - build-port-drayage
      - build-v2xhub-manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker Compose
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/v2xhub-application
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
      - name: Publish Docker Compose OCI artifact
        working-directory: configuration
        env:
          TAG_NAME: ${{ steps.meta.outputs.version }}
          V2XHUB_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "Publishing with TAG_NAME=${TAG_NAME} V2XHUB_VERSION=${V2XHUB_VERSION}"
          docker compose publish --with-env --yes ${{ steps.meta.outputs.tags }}

  integration-tests:
    runs-on: ubuntu-24.04
    needs:
      - build-php
      - build-port-drayage
      - build-v2xhub-manifest
      - publish-docker-compose
    timeout-minutes: 35
    steps:
      - name: Checkout v2xhub-integration-tests
        uses: actions/checkout@v5
        with:
          repository: usdot-fhwa-OPS/v2xhub-integration-tests
          ref: develop
          token: ${{ secrets.V2XHUB_INTEGRATION_TESTS_REPO_TOKEN }}
          path: v2xhub-integration-tests
      - name: Extract metadata (tag) for integration tests
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/v2xhub
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2xhub-integration-tests/requirements.txt
      - name: Install test dependencies
        working-directory: v2xhub-integration-tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run integration tests
        working-directory: v2xhub-integration-tests
        env:
          TAG_NAME: ${{ steps.meta.outputs.version }}
          V2XHUB_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "Running tests with TAG_NAME=${TAG_NAME} V2XHUB_VERSION=${V2XHUB_VERSION}"
          pytest -v tests/test_case.py