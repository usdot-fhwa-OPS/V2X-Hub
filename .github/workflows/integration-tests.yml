name: V2X-Hub Integration Tests

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master
      - 'release/**'
      - 'feature/**'
    tags:
      - '*'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout V2X-Hub
        uses: actions/checkout@v5
        with:
          path: V2X-Hub

      - name: Checkout v2xhub-integration-tests
        uses: actions/checkout@v5
        with:
          repository: usdot-fhwa-OPS/v2xhub-integration-tests
          ref: develop
          token: ${{ secrets.V2XHUB_INTEGRATION_TESTS_REPO_TOKEN }}
          path: v2xhub-integration-tests

      - name: Set TAG_NAME and V2XHUB_VERSION for this ref
        working-directory: v2xhub-integration-tests
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            IMAGE_TAG="${{ github.head_ref }}"
          else
            IMAGE_TAG="${{ github.ref_name }}"
          fi
          IMAGE_TAG="${IMAGE_TAG//\//-}"
          sed -i "s/^TAG_NAME=.*/TAG_NAME=${IMAGE_TAG}/" .env
          sed -i "s/^V2XHUB_VERSION=.*/V2XHUB_VERSION=${IMAGE_TAG}/" .env
          echo "Using TAG_NAME=${IMAGE_TAG}"
          echo "Using V2XHUB_VERSION=${IMAGE_TAG}"
          cat .env
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2xhub-integration-tests/requirements.txt

      - name: Install test dependencies
        working-directory: v2xhub-integration-tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        working-directory: v2xhub-integration-tests
        run: |
          pytest -v tests/test_case.py
